    <main class="figure-hero">

                    <img src="images/figures/figure04.jpg" alt="">

                    <img src="images/figures/figure01.jpg" alt="">
                    <img src="images/figures/figure02.jpg" alt="">
                    <img src="images/figures/figure03.jpg" alt="">

                    <img src="images/figures/figure06.jpg" alt="">

                </div>

            </div>


            <!-- 2段目 -->
            <div class="figure-row">

                <div class="figure-track reverse">

                    <img src="images/figures/figure07.jpg" alt="">
                    <img src="images/figures/figure08.jpg" alt="">
                    <img src="images/figures/figure09.jpg" alt="">

            </div>


            <!-- 3段目 -->
            <div class="figure-row">

                <div class="figure-track slow">

                    <img src="images/figures/figure03.jpg" alt="">
                    <img src="images/figures/figure06.jpg" alt="">
                    <img src="images/figures/figure01.jpg" alt="">
                    <img src="images/figures/figure09.jpg" alt="">
                    <img src="images/figures/figure04.jpg" alt="">
                    <img src="images/figures/figure08.jpg" alt="">

                    <img src="images/figures/figure03.jpg" alt="">

        <div class="figure-overlay"></div>


        <!-- ============================
             中央文字
        ============================= -->

        <div class="figure-content">

            <p class="figure-label">
                MY HOBBY
            </p>

            <h1>
                フィギュア集め
            </h1>

            <p class="figure-en">
                FIGURE COLLECTION
            </p>

            <p class="figure-description">
                好きな作品やキャラクターのフィギュアを
                集めることが趣味です。
            </p>

        </div>
